# Workspace task runner. Run `mise tasks` to list tasks.

[tools]
bun = "latest"

[tasks.api-guard]
description = "Assert dd-auth-token-core API hygiene (encode_with_nonce gating, test-support dev-only)"
run = "bun scripts/api-guard.ts"

[tasks.fmt]
description = "Format all Rust code"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Check formatting without writing"
run = "cargo fmt --all --check"

[tasks.check]
description = "Type-check the workspace"
run = "cargo check --workspace --all-targets --all-features"

[tasks.clippy]
description = "Lint with Clippy, failing on warnings"
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks.test]
description = "Run all tests"
run = "cargo test --workspace --all-features"

[tasks.docs]
description = "Build documentation"
run = "cargo doc --workspace --all-features --no-deps"

[tasks.audit]
description = "Dependency/advisory check (cargo-deny if present, else cargo audit)"
run = """
if command -v cargo-deny >/dev/null 2>&1; then
  cargo deny check
elif command -v cargo-audit >/dev/null 2>&1; then
  cargo audit
else
  echo "Neither cargo-deny nor cargo-audit installed; install one to run audit" >&2
  exit 1
fi
"""

[tasks.spec]
description = "Run the TLA+ safety models (MVP-020, tla-checker 0.3.9)"
run = """
if ! command -v tla >/dev/null 2>&1; then
  echo "tla not installed; run 'cargo install tla-checker --version 0.3.9'" >&2
  exit 1
fi
tla spec/tla/MagicLink.tla --allow-deadlock
tla spec/tla/MagicLinkRace.tla --allow-deadlock
tla spec/tla/Session.tla --allow-deadlock
tla spec/tla/Pow.tla --allow-deadlock
tla spec/tla/Liveness.tla --check-liveness --allow-deadlock
"""

[tasks.ts-verify]
description = "Verify the dd-protect-client TypeScript package: install, lint, type-check, test"
dir = "packages/dd-protect-client"
run = """
if ! command -v bun >/dev/null 2>&1; then
  echo "bun not installed; install bun to verify packages/dd-protect-client" >&2
  exit 1
fi
bun install
bun run lint
bun run typecheck
bun test ts/
"""

[tasks.verify]
description = "Full verification: fmt-check + clippy + test + docs + audit + api-guard + ts-verify + spec"
depends = ["fmt-check", "clippy", "test", "docs", "audit", "api-guard", "ts-verify", "spec"]
