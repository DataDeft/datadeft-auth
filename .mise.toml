# Workspace task runner. Run `mise tasks` to list tasks.

[tools]
bun = "latest"

[tasks.api-guard]
description = "Assert dd-auth-token-core API hygiene (encode_with_nonce gating, test-support dev-only)"
run = "bun scripts/api-guard.ts"

[tasks.token-core-guard]
description = "dd-auth-token-core guard: API hygiene, no-features build, gated surface test"
depends = ["api-guard"]
run = """
cargo build -p dd-auth-token-core --no-default-features
cargo test -p dd-auth-token-core --features test-support --test encode_with_nonce_gated
"""

[tasks.fmt]
description = "Format all Rust code"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Check formatting without writing"
run = "cargo fmt --all --check"

[tasks.check]
description = "Type-check the workspace"
run = "cargo check --workspace --all-targets --all-features"

[tasks.clippy]
description = "Lint with Clippy, failing on warnings"
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks.test]
description = "Run all tests"
run = "cargo test --workspace --all-features"

[tasks.docs]
description = "Build documentation"
run = "cargo doc --workspace --all-features --no-deps"

[tasks.audit]
description = "Dependency advisory and license check (cargo-deny, mise-managed prebuilt)"
tools = { "ubi:EmbarkStudios/cargo-deny" = "latest" }
run = "cargo-deny check"

[tasks.spec]
description = "Run the TLA+ safety models (MVP-020)"
tools = { "cargo:tla-checker" = "0.3.9" }
run = """
tla spec/tla/MagicLink.tla --allow-deadlock
tla spec/tla/MagicLinkRace.tla --allow-deadlock
tla spec/tla/Session.tla --allow-deadlock
tla spec/tla/Pow.tla --allow-deadlock
tla spec/tla/Liveness.tla --check-liveness --allow-deadlock
"""

[tasks.ts-verify]
description = "Verify the dd-protect-client TypeScript package: install, lint, type-check, test"
dir = "packages/dd-protect-client"
run = """
bun install
bun run lint
bun run typecheck
bun test ts/
"""

[tasks.verify]
description = "Full verification: fmt-check + clippy + test + docs + audit + token-core-guard + ts-verify + spec"
depends = ["fmt-check", "clippy", "test", "docs", "audit", "token-core-guard", "ts-verify", "spec"]
