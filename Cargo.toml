[workspace]
resolver = "3"
# Rust crates, examples and the private Elixir Port executable share a workspace.
# The optional `packages/dd-protect-client` TS package is managed separately.
members = ["crates/*", "examples/*", "packages/datadeft-auth-elixir/native/datadeft_auth_port"]

[workspace.package]
version = "0.6.0" # x-release-please-version
edition = "2024"
rust-version = "1.94.1"
license = "MIT"
repository = "https://github.com/DataDeft/datadeft-auth"
authors = ["Istvan <dev@l1x.be>"]

# Security-baseline floors, bumped in one place. Maintained Smithy releases
# remove pin-utils and require Rust 1.94.1. Members add their own features.
[workspace.dependencies]
# Owner: the Elixir port executable. Reason: deployment-role credential chain,
# region resolution and the default HTTPS client for the SDK clients it owns.
aws-config = { version = "1.8", default-features = false, features = [
  "behavior-version-latest",
  "default-https-client",
  "rt-tokio",
] }
aws-sdk-dynamodb = { version = "1.137", default-features = false, features = ["rt-tokio"] }
aws-sdk-secretsmanager = { version = "1.125", default-features = false, features = ["rt-tokio"] }
aws-sdk-sesv2 = { version = "1.145", default-features = false, features = ["rt-tokio"] }
aws-smithy-http-client = { version = "1.5.2" }
tokio = { version = "1.53.3", default-features = false }

# Shared lint policy: production code never unwraps or leaves stubs behind.
# Test code is exempted via clippy.toml (allow-unwrap-in-tests etc.).
[workspace.lints.clippy]
uninlined_format_args = "allow"
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.dev]
incremental = true

[profile.bench]
lto = "thin"
codegen-units = 16
