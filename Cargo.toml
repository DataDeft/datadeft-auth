[workspace]
resolver = "3"
# Rust crates and examples are workspace members. The optional
# `packages/dd-protect-client` TS package is managed separately.
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.4.1" # x-release-please-version
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/DataDeft/datadeft-auth"
authors = ["Istvan <dev@l1x.be>"]

# Shared lint policy: production code never unwraps or leaves stubs behind.
# Test code is exempted via clippy.toml (allow-unwrap-in-tests etc.).
[workspace.lints.clippy]
uninlined_format_args = "allow"
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.dev]
incremental = true

[profile.bench]
lto = "thin"
codegen-units = 16
