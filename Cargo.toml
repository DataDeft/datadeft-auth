[workspace]
resolver = "3"
# Rust crates, examples and the private Elixir Port executable share a workspace.
# The optional `packages/dd-protect-client` TS package is managed separately.
members = ["crates/*", "examples/*", "packages/datadeft-auth-elixir/native/datadeft_auth_port"]

[workspace.package]
version = "0.5.0" # x-release-please-version
edition = "2024"
rust-version = "1.94.1"
license = "MIT"
repository = "https://github.com/DataDeft/datadeft-auth"
authors = ["Istvan <dev@l1x.be>"]

# Shared lint policy: production code never unwraps or leaves stubs behind.
# Test code is exempted via clippy.toml (allow-unwrap-in-tests etc.).
[workspace.lints.clippy]
uninlined_format_args = "allow"
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.dev]
incremental = true

[profile.bench]
lto = "thin"
codegen-units = 16
