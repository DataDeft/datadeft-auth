[tasks.deps]
run = "mix deps.get"

[tasks.fmt]
description = "Format the Elixir package"
run = "mix format"

[tasks.fmt-check]
run = "mix format --check-formatted"

[tasks.check]
run = "mix compile --warnings-as-errors"

[tasks.test]
run = "mix test --warnings-as-errors"

[tasks.compatibility-test]
description = "Run repository vectors (DD_AUTH_COMPATIBILITY_DIR required)"
run = "mix test --warnings-as-errors --include repository"

[tasks.dynamodb-compatibility-test]
description = "Mixed-language shared-counter tests (DynamoDB Local and Rust required)"
run = "mix test --warnings-as-errors --include dynamodb"

[tasks.native-release-smoke]
description = "Source-build a production Mix release and exercise its bundled NIF"
env = { MIX_ENV = "prod" }
run = """
mix release --overwrite
_build/prod/rel/datadeft_auth/bin/datadeft_auth eval '
  key = :crypto.strong_rand_bytes(32)
  with {:ok, token} <- DatadeftAuth.Token.Branca.encode("synthetic release smoke", key, 123),
       {:ok, {123, nonce, "synthetic release smoke"}} <- DatadeftAuth.Token.Branca.decode(token, key),
       true <- byte_size(nonce) == 24 do
    :ok
  else
    _ -> System.halt(1)
  end
'
"""

[tasks.verify]
description = "Check formatting, Rust NIF compilation and Elixir tests"
run = """
mix format --check-formatted
mix compile --warnings-as-errors
mix test --warnings-as-errors
"""
