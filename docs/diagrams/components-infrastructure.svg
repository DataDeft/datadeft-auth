<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Datadeft authentication components and infrastructure</title>
  <desc id="desc">The browser crosses an untrusted network into the consuming application and edge. Independent proof-of-work admission uses datadeft-pow-core. Magic-link HTTP helpers call the service and core crates, which use DynamoDB, SES, and externally loaded secrets.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <style>
      .title{font:700 24px system-ui,sans-serif;fill:#0f172a}.label{font:600 16px system-ui,sans-serif;fill:#0f172a}.small{font:13px system-ui,sans-serif;fill:#334155}.box{stroke:#334155;stroke-width:2;rx:10}.implemented{fill:#dcfce7}.external{fill:#dbeafe}.planned{fill:#fef3c7;stroke-dasharray:8 5}.infra{fill:#f3e8ff}.line{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}.boundary{fill:none;stroke:#dc2626;stroke-width:2;stroke-dasharray:10 6}.boundaryLabel{font:700 13px system-ui,sans-serif;fill:#b91c1c}
    </style>
  </defs>
  <text x="40" y="42" class="title">Datadeft authentication: components and trust boundaries</text>

  <rect x="35" y="80" width="170" height="80" class="box external"/><text x="120" y="112" text-anchor="middle" class="label">Browser</text><text x="120" y="136" text-anchor="middle" class="small">untrusted input</text>
  <rect x="245" y="65" width="305" height="545" class="boundary"/><text x="260" y="88" class="boundaryLabel">CONSUMING APPLICATION / EDGE</text>
  <rect x="275" y="115" width="245" height="95" class="box external"/><text x="397" y="145" text-anchor="middle" class="label">Router + edge policy</text><text x="397" y="168" text-anchor="middle" class="small">TLS, trusted geo/IP, logs</text><text x="397" y="189" text-anchor="middle" class="small">templates, redirects, secrets</text>
  <rect x="275" y="250" width="245" height="90" class="box planned"/><text x="397" y="280" text-anchor="middle" class="label">PoW admission</text><text x="397" y="303" text-anchor="middle" class="small">endpoint, policy, replay</text><text x="397" y="324" text-anchor="middle" class="small">planned integration</text>
  <rect x="275" y="390" width="245" height="90" class="box implemented"/><text x="397" y="420" text-anchor="middle" class="label">datadeft-magic-link-axum</text><text x="397" y="443" text-anchor="middle" class="small">bounds, Origin, cookies</text><text x="397" y="464" text-anchor="middle" class="small">implemented</text>
  <rect x="275" y="520" width="245" height="65" class="box planned"/><text x="397" y="548" text-anchor="middle" class="label">dd-protect-client</text><text x="397" y="570" text-anchor="middle" class="small">browser solver: planned</text>

  <rect x="610" y="105" width="245" height="90" class="box implemented"/><text x="732" y="136" text-anchor="middle" class="label">datadeft-pow-core</text><text x="732" y="160" text-anchor="middle" class="small">pure mint + verify</text><text x="732" y="181" text-anchor="middle" class="small">implemented</text>
  <rect x="610" y="245" width="245" height="90" class="box implemented"/><text x="732" y="276" text-anchor="middle" class="label">datadeft-magic-link-service</text><text x="732" y="300" text-anchor="middle" class="small">request, confirm, session</text><text x="732" y="321" text-anchor="middle" class="small">implemented</text>
  <rect x="610" y="385" width="245" height="95" class="box implemented"/><text x="732" y="416" text-anchor="middle" class="label">Core cryptography</text><text x="732" y="440" text-anchor="middle" class="small">magic-link + auth-token</text><text x="732" y="461" text-anchor="middle" class="small">IO-free, implemented</text>

  <rect x="930" y="90" width="220" height="80" class="box infra"/><text x="1040" y="122" text-anchor="middle" class="label">Secret manager</text><text x="1040" y="146" text-anchor="middle" class="small">loaded by application</text>
  <rect x="930" y="245" width="220" height="90" class="box infra"/><text x="1040" y="278" text-anchor="middle" class="label">DynamoDB</text><text x="1040" y="302" text-anchor="middle" class="small">atomic auth + sessions</text><text x="1040" y="322" text-anchor="middle" class="small">optional AWS adapter</text>
  <rect x="930" y="405" width="220" height="80" class="box infra"/><text x="1040" y="437" text-anchor="middle" class="label">SES / outbox</text><text x="1040" y="461" text-anchor="middle" class="small">application-rendered email</text>

  <path d="M205 120H275" class="line"/><path d="M397 210V250" class="line"/><path d="M520 295H610V150" class="line"/><path d="M397 340V390" class="line"/><path d="M520 435H565V290H610" class="line"/><path d="M732 335V385" class="line"/><path d="M855 290H930" class="line"/><path d="M855 300C900 300 900 445 930 445" class="line"/><path d="M930 130H880V430H855" class="line"/><path d="M275 552H230V120H205" class="line"/>

  <text x="42" y="662" class="small">Green = implemented library component · Blue = consuming application responsibility · Purple = infrastructure · Dashed amber = planned/not complete</text>
</svg>
