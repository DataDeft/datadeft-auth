<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Scanner-safe magic-link sequence</title>
  <desc id="desc">A request creates and emails a challenge. A non-consuming GET validates it and creates bound flow state. An explicit same-origin POST atomically consumes the challenge and creates a server-side session.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <style>.title{font:700 24px system-ui,sans-serif;fill:#0f172a}.head{font:700 15px system-ui,sans-serif;fill:#0f172a}.text{font:13px system-ui,sans-serif;fill:#334155}.note{font:12px system-ui,sans-serif;fill:#7c2d12}.box{fill:#e0f2fe;stroke:#334155;stroke-width:2;rx:8}.life{stroke:#94a3b8;stroke-width:2;stroke-dasharray:6 5}.msg{stroke:#334155;stroke-width:2;marker-end:url(#arrow)}.return{stroke:#2563eb;stroke-width:2;stroke-dasharray:6 4;marker-end:url(#arrow)}.phase{fill:#f8fafc;stroke:#cbd5e1;rx:8}</style>
  </defs>
  <text x="35" y="38" class="title">Magic-link request, scanner-safe confirmation, and session creation</text>
  <g><rect x="30" y="60" width="145" height="48" class="box"/><text x="102" y="89" text-anchor="middle" class="head">Browser</text><rect x="250" y="60" width="180" height="48" class="box"/><text x="340" y="89" text-anchor="middle" class="head">App / Axum</text><rect x="520" y="60" width="180" height="48" class="box"/><text x="610" y="89" text-anchor="middle" class="head">ML service</text><rect x="790" y="60" width="180" height="48" class="box"/><text x="880" y="89" text-anchor="middle" class="head">Repository</text><rect x="1060" y="60" width="150" height="48" class="box"/><text x="1135" y="89" text-anchor="middle" class="head">Email</text><rect x="1260" y="60" width="110" height="48" class="box"/><text x="1315" y="89" text-anchor="middle" class="head">Session</text></g>
  <g><line x1="102" y1="108" x2="102" y2="860" class="life"/><line x1="340" y1="108" x2="340" y2="860" class="life"/><line x1="610" y1="108" x2="610" y2="860" class="life"/><line x1="880" y1="108" x2="880" y2="860" class="life"/><line x1="1135" y1="108" x2="1135" y2="860" class="life"/><line x1="1315" y1="108" x2="1315" y2="860" class="life"/></g>

  <rect x="20" y="130" width="1360" height="195" class="phase"/><text x="35" y="153" class="head">1. Request</text>
  <line x1="102" y1="180" x2="340" y2="180" class="msg"/><text x="221" y="172" text-anchor="middle" class="text">request normalized email + consent</text>
  <line x1="340" y1="215" x2="610" y2="215" class="msg"/><text x="475" y="207" text-anchor="middle" class="text">request_magic_link</text>
  <line x1="610" y1="250" x2="880" y2="250" class="msg"/><text x="745" y="242" text-anchor="middle" class="text">email limits and keyed challenge store</text>
  <line x1="610" y1="285" x2="1135" y2="285" class="msg"/><text x="872" y="277" text-anchor="middle" class="text">application-rendered bearer link</text>
  <line x1="610" y1="310" x2="102" y2="310" class="return"/><text x="356" y="302" text-anchor="middle" class="text">generic accepted response</text>

  <rect x="20" y="345" width="1360" height="230" class="phase"/><text x="35" y="368" class="head">2. Non-consuming landing</text>
  <line x1="102" y1="395" x2="340" y2="395" class="msg"/><text x="221" y="387" text-anchor="middle" class="text">GET /magic-link?token=...</text>
  <line x1="340" y1="430" x2="610" y2="430" class="msg"/><text x="475" y="422" text-anchor="middle" class="text">begin_magic_link_landing</text>
  <line x1="610" y1="465" x2="880" y2="465" class="msg"/><text x="745" y="457" text-anchor="middle" class="text">selector limit + consistent read</text>
  <line x1="880" y1="495" x2="610" y2="495" class="return"/><text x="745" y="487" text-anchor="middle" class="text">candidate or miss</text>
  <text x="620" y="522" class="note">constant-time real/dummy verifier work. GET never consumes</text>
  <line x1="610" y1="545" x2="102" y2="545" class="return"/><text x="356" y="537" text-anchor="middle" class="text">flow cookie + account page + confirmation nonce</text>

  <rect x="20" y="595" width="1360" height="270" class="phase"/><text x="35" y="618" class="head">3. Explicit confirmation and session</text>
  <line x1="102" y1="645" x2="340" y2="645" class="msg"/><text x="221" y="637" text-anchor="middle" class="text">same-origin POST confirmation</text>
  <line x1="340" y1="680" x2="610" y2="680" class="msg"/><text x="475" y="672" text-anchor="middle" class="text">confirm_magic_link_flow</text>
  <text x="620" y="704" class="note">verify AEAD + selector/verifier/account/expiry/nonce</text>
  <line x1="610" y1="730" x2="880" y2="730" class="msg"/><text x="745" y="722" text-anchor="middle" class="text">consistent reads + atomic 5-action commit</text>
  <line x1="880" y1="765" x2="1315" y2="765" class="msg"/><text x="1097" y="757" text-anchor="middle" class="text">challenge consumed + session record created</text>
  <line x1="880" y1="800" x2="610" y2="800" class="return"/><text x="745" y="792" text-anchor="middle" class="text">committed exactly once</text>
  <line x1="610" y1="835" x2="102" y2="835" class="return"/><text x="356" y="827" text-anchor="middle" class="text">session cookie + clear flow cookie + fixed 303</text>
</svg>
