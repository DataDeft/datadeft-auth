name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: jdx/mise-action@v2
      # One gate. mise runs fmt-check, clippy, test, docs, audit,
      # token-core-guard, ts-verify, and spec in parallel, and installs the
      # tools it needs (bun, cargo-deny, tla-checker). See .mise.toml.
      - run: mise run verify
