name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: '26.2'
          elixir-version: '1.16.3'
      # One gate. mise runs fmt-check, clippy, test, test-default-features, docs, audit,
      # token-core-guard, ts-verify, elixir-verify, spec, spec-mutants, release-check, and
      # workflow-check in parallel, and installs the tools it needs (bun,
      # cargo-deny, tla-checker, actionlint). See mise.toml.
      - run: mise run verify
      - run: mise run package-crates

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: '1.94.1'
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: mise run msrv

  elixir-platforms:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            otp: '26.2'
            elixir: '1.16.3'
          - os: ubuntu-24.04-arm
            otp: '26.2'
            elixir: '1.16.3'
          - os: ubuntu-22.04
            otp: '28'
            elixir: '1.19'
          - os: ubuntu-24.04-arm
            otp: '28'
            elixir: '1.19'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      - run: mise run elixir-verify
