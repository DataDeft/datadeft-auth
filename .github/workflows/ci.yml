name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# mise resolves tool releases through the GitHub API; unauthenticated
# requests hit the shared rate limit (403) when several runs overlap. The
# token is read-only (see permissions) and never enters the containers.
env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # mise installs Rust through rustup and, when rustup is missing, would
      # fetch and run sh.rustup.rs unverified. Hosted runners ship rustup;
      # fail instead of letting mise bootstrap it.
      - run: command -v rustup
      # Installs the tools in mise.toml, Rust 1.99.1 included.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: '26.2'
          elixir-version: '1.16.3'
      # One gate. mise runs fmt-check, clippy, test, test-default-features, docs, audit,
      # token-core-guard, ts-verify, elixir-verify, spec, spec-mutants, release-check, and
      # workflow-check in parallel, and installs the tools it needs (bun,
      # cargo-deny, tla-checker, actionlint). See mise.toml.
      - run: mise run verify
      # Real Rust transactions plus mixed-language shared-counter admission.
      - run: mise run dynamodb-local-test
      - run: mise run dynamodb-compatibility-test
      - run: mise run package-crates

  elixir-platforms:
    strategy:
      fail-fast: false
      matrix:
        # Debian (glibc) and Alpine (musl), each on x64 and AArch64, in the
        # official elixir images. Each distro runs the floor BEAM on one
        # architecture and the newest on the other.
        include:
          - { distro: debian, runner: ubuntu-latest, image: 'elixir:1.16.3-otp-26' }
          - { distro: debian, runner: ubuntu-24.04-arm, image: 'elixir:1.19-otp-28' }
          - { distro: alpine, runner: ubuntu-latest, image: 'elixir:1.19-otp-28-alpine' }
          - { distro: alpine, runner: ubuntu-24.04-arm, image: 'elixir:1.16.3-otp-26-alpine' }
    name: elixir-platforms (${{ matrix.distro }}, ${{ matrix.runner }}, ${{ matrix.image }})
    runs-on: ${{ matrix.runner }}
    # The host runs the orchestration script; the Elixir container needs no Rust.
    env:
      MISE_DISABLE_TOOLS: rust
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      # docker instead of a job container: JavaScript actions such as checkout
      # need the runner's glibc Node, which Alpine images lack.
      - env:
          IMAGE: ${{ matrix.image }}
        run: mise run elixir-image-verify "$IMAGE"
