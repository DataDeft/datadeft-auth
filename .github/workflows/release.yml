name: Publish registries
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: registry-release
  cancel-in-progress: false
jobs:
  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: Validate the tag and reviewed ancestry
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat version.txt)"
          git merge-base --is-ancestor HEAD origin/main
      - name: Require public source before any registry upload
        if: vars.REGISTRY_PUBLISH_ENABLED == 'true'
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: test "$REPOSITORY_PRIVATE" = 'false'
      - run: mise run verify
      - run: mise run package-crates
  crates:
    needs: verify
    if: vars.REGISTRY_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: registry-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      # Finish building before starting the temporary credential's 30m lifetime.
      - run: mise run package-crates
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
        id: auth
      - run: mise run publish-crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
  npm:
    needs: [verify, crates]
    if: vars.REGISTRY_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: registry-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require public source for npm provenance
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: test "$REPOSITORY_PRIVATE" = 'false'
      - run: mise run ts-verify
      - run: npm publish --provenance --access public --ignore-scripts
        working-directory: packages/dd-protect-client
