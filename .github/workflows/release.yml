name: Release verification
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: registry-release
  cancel-in-progress: false
jobs:
  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: '26.2'
          elixir-version: '1.16.3'
      - name: Validate the tag and reviewed ancestry
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat version.txt)"
          git merge-base --is-ancestor HEAD origin/main
      - run: mise run verify
      - run: mise run package-crates
