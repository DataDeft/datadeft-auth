# Workspace task runner. Run `mise tasks` to list tasks.

[vars]
# Keep in sync with workspace.package.rust-version in Cargo.toml.
msrv = "1.94.1"

[tools]
bun = "latest"
node = "24"

[tasks.api-guard]
description = "Assert datadeft-auth-token-core API hygiene (encode_with_nonce gating, test-support dev-only)"
run = "bun scripts/api-guard.ts"

[tasks.token-core-guard]
description = "datadeft-auth-token-core guard: API hygiene, no-features build, gated surface test"
depends = ["api-guard"]
run = """
cargo build -p datadeft-auth-token-core --no-default-features
cargo test -p datadeft-auth-token-core --features test-support --test encode_with_nonce_gated
"""

[tasks.fmt]
description = "Format all Rust code"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Check formatting without writing"
run = "cargo fmt --all --check"

[tasks.check]
description = "Type-check the workspace"
run = "cargo check --workspace --all-targets --all-features"

[tasks.clippy]
description = "Lint with Clippy, failing on warnings"
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks.test]
description = "Run all tests"
run = "cargo test --workspace --all-features"

[tasks.docs]
description = "Build documentation"
run = "cargo doc --workspace --all-features --no-deps"
env = { RUSTDOCFLAGS = "-D warnings" }

[tasks.deps-update]
description = "Update Cargo.lock; pass targeted cargo update flags after --"
run = "cargo update"

[tasks.audit]
description = "Dependency advisory and license check (cargo-deny, mise-managed prebuilt)"
tools = { "ubi:EmbarkStudios/cargo-deny" = "latest" }
run = "cargo-deny check"

[tasks.spec]
description = "Run the TLA+ models (MVP-020)"
tools = { "cargo:tla-checker" = "0.3.9" }
run = """
tla spec/tla/MagicLink.tla --allow-deadlock
tla spec/tla/MagicLinkRace.tla --allow-deadlock
tla spec/tla/Session.tla --allow-deadlock
tla spec/tla/Session.tla --config spec/tla/SessionAdmin.cfg --allow-deadlock
tla spec/tla/KeyRotation.tla --allow-deadlock
tla spec/tla/PowBudget.tla --allow-deadlock
tla spec/tla/AdminRace.tla --allow-deadlock
tla spec/tla/Erasure.tla --allow-deadlock
tla spec/tla/Pow.tla --allow-deadlock
tla spec/tla/Liveness.tla --check-liveness
"""

[tasks.dynamodb-local-test]
description = "Integration tests against DynamoDB Local (needs Docker)"
run = """
docker run --rm -d --name datadeft-dynamodb-local -p 18000:8000 amazon/dynamodb-local -jar DynamoDBLocal.jar -inMemory -sharedDb >/dev/null
trap 'docker stop datadeft-dynamodb-local >/dev/null' EXIT
sleep 2
DYNAMODB_LOCAL_ENDPOINT=http://localhost:18000 cargo test -p datadeft-magic-link-aws --features aws --test dynamodb_local -- --ignored --test-threads 1
"""

[tasks.fuzz]
description = "Fuzz every untrusted-input parser for 60 s each (cargo-fuzz, nightly)"
dir = "fuzz"
run = """
for target in $(cargo +nightly fuzz list); do
  cargo +nightly fuzz run "$target" -- -max_total_time=60 -max_len=10000 || exit 1
done
"""

[tasks.spec-mutants]
description = "Prove every TLA+ invariant can fail: each mutant must be caught"
tools = { "cargo:tla-checker" = "0.3.9" }
run = "bun scripts/spec-mutants.ts"

[tasks.ts-verify]
description = "Verify the npm package including its built and packed consumer surface"
run = """
bun install --frozen-lockfile --ignore-scripts
mise -C packages/dd-protect-client run verify
"""

[tasks.package-crates]
description = "Package and build all seven crates, staging unpublished workspace dependencies"
# datadeft-auth-port is publish = false (it ships inside the Hex package via
# the vendored stage), but `cargo package --workspace` still tries to verify
# its path-only manifest, so exclude it like the example binary.
run = "cargo package --workspace --exclude axum-magic-link --exclude datadeft-auth-port --all-features --locked"

[tasks.crates-dry-run]
description = "Try every crate against crates.io in dependency order; never uploads"
run = "bun scripts/registry-release.ts dry-run"

[tasks.release-check]
description = "Check release versions, registry metadata, licenses and package boundaries"
run = "bun scripts/registry-release.ts check"

[tasks.publish-crates]
description = "Publish approved release from GitHub Actions using its temporary OIDC credential"
run = "bun scripts/registry-release.ts publish"

[tasks.msrv-install]
description = "Install the declared minimum Rust toolchain"
run = "rustup toolchain install {{vars.msrv}} --profile minimal"

[tasks.msrv]
description = "Check the declared minimum Rust version (mise run msrv-install first)"
run = "cargo +{{vars.msrv}} check --workspace --all-targets --all-features --locked"

[tasks.test-default-features]
description = "Build every crate's tests with default features, one crate at a time (workspace feature unification hides gaps)"
run = """
for crate in datadeft-auth-token-core datadeft-magic-link-core datadeft-magic-link-service datadeft-magic-link-axum datadeft-magic-link-aws datadeft-pow-core datadeft-pow-axum datadeft-auth-port; do
  cargo test -q -p "$crate" --no-run || exit 1
done
"""

[tasks.elixir-verify]
description = "Verify the Elixir Port package and isolated Hex source/release builds (requires Elixir/OTP)"
run = """
mise -C packages/datadeft-auth-elixir run deps
mise -C packages/datadeft-auth-elixir run verify
"""

[tasks.port-test]
description = "Test the private Rust Port executable"
run = "cargo test -p datadeft-auth-port"

[tasks.port-clippy]
description = "Lint the private Rust Port executable"
run = "cargo clippy -p datadeft-auth-port --all-targets -- -D warnings"

[tasks.verify]
description = "Full verification: Rust + browser + Elixir + formal models + release/workflow checks"
depends = ["fmt-check", "clippy", "test", "test-default-features", "docs", "audit", "token-core-guard", "ts-verify", "elixir-verify", "spec", "spec-mutants", "release-check", "workflow-check"]

[tasks.js-lock]
description = "Update Bun dependencies and normalize the lockfile for release-please"
run = """
bun install --ignore-scripts
bun scripts/normalize-bun-lock.ts
"""

[tasks.workflow-check]
description = "Validate GitHub Actions and shell commands"
tools = { "ubi:rhysd/actionlint" = "1.7.7" }
run = "actionlint"
