[package]
name = "axum-magic-link"
publish = false
description = "Example app wiring datadeft-magic-link-service with an Axum router."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "axum-magic-link"
path = "src/main.rs"

[dependencies]
axum = "0.8"
# The minimal consumer dependency set: the service crate re-exports the keyring
# and lookup-key types, the axum crate owns HTTP, and the aws crate's default
# (SDK-free) build provides the in-memory fakes. datadeft-pow-core is optional
# admission hardening.
datadeft-magic-link-aws = { path = "../../crates/datadeft-magic-link-aws", version = "0.4.1" } # x-release-please-version
datadeft-magic-link-axum = { path = "../../crates/datadeft-magic-link-axum", version = "0.4.1" } # x-release-please-version
datadeft-magic-link-service = { path = "../../crates/datadeft-magic-link-service", version = "0.4.1" } # x-release-please-version
datadeft-pow-core = { path = "../../crates/datadeft-pow-core", version = "0.4.1" } # x-release-please-version
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3.47", default-features = false, features = ["formatting", "std"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
