[package]
name = "axum-magic-link"
description = "Example app wiring dd-magic-link-service with an Axum router."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "axum-magic-link"
path = "src/main.rs"

[dependencies]
axum = "0.8"
# The minimal consumer dependency set: the service crate re-exports the keyring
# and lookup-key types, the axum crate owns HTTP, and the aws crate's default
# (SDK-free) build provides the in-memory fakes. dd-pow-core is optional
# admission hardening.
dd-magic-link-aws = { path = "../../crates/dd-magic-link-aws" }
dd-magic-link-axum = { path = "../../crates/dd-magic-link-axum" }
dd-magic-link-service = { path = "../../crates/dd-magic-link-service" }
dd-pow-core = { path = "../../crates/dd-pow-core" }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3.47", default-features = false, features = ["formatting", "std"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
