<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Confirm sign in</title>
  <script src="/login/confirm.js" defer></script>
</head>
<body>
  <main>
    <h1>Confirm sign in</h1>
    <p id="status" aria-live="polite" data-unusable="This link cannot be used. Request a new one." data-busy="The service is busy. Try again in a moment.">Checking your link…</p>
    <form id="confirm" hidden>
      <p>Sign in as <strong id="account"></strong>.</p>
      <button type="submit">Continue sign in</button>
    </form>
  </main>
</body>
</html>
