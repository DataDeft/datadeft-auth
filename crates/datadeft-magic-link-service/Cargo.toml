[package]
name = "datadeft-magic-link-service"
description = "Framework-neutral magic-link request and scanner-safe authentication orchestration."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["authentication", "security", "passwordless"]
include = ["src/**", "tests/**", "benches/**", "README.md", "LICENSE"]

[lints]
workspace = true

[dependencies]
datadeft-magic-link-core = { path = "../datadeft-magic-link-core", version = "0.5.0" } # x-release-please-version
datadeft-auth-token-core = { path = "../datadeft-auth-token-core", version = "0.5.0" } # x-release-please-version
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
hex = "0.4"
rand_core = "0.6"
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
datadeft-auth-token-core = { path = "../datadeft-auth-token-core", version = "0.5.0", features = ["test-support"] } # x-release-please-version
tokio = { workspace = true, features = ["macros", "rt"] }

[[bench]]
name = "config_cost"
harness = false
