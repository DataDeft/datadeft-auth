[package]
name = "dd-pow-axum"
description = "Optional Axum HTTP glue for the dd-pow-core proof-of-work admission gate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["json"] }
dd-auth-token-core = { path = "../dd-auth-token-core" }
dd-pow-core = { path = "../dd-pow-core" }
rand_core = "0.6"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
dd-auth-token-core = { path = "../dd-auth-token-core", features = ["test-support"] }
blake3 = "1"
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
serde_json = "1"
