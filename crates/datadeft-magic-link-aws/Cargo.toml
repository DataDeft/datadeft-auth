[package]
name = "datadeft-magic-link-aws"
description = "Optional AWS DynamoDB/SES adapters for datadeft-magic-link-service."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["authentication", "security", "passwordless"]
include = ["src/**", "tests/**", "README.md", "LICENSE"]

[lints]
workspace = true

[features]
default = []
aws = [
  "dep:aws-sdk-dynamodb",
  "dep:aws-sdk-secretsmanager",
  "dep:aws-sdk-sesv2",
  "dep:tokio",
]

[dependencies]
datadeft-magic-link-service = { path = "../datadeft-magic-link-service", version = "0.5.0" } # x-release-please-version
aws-sdk-dynamodb = { version = "1", optional = true, default-features = false, features = ["rt-tokio"] }
aws-sdk-secretsmanager = { version = "1", optional = true, default-features = false, features = ["rt-tokio"] }
aws-sdk-sesv2 = { version = "1", optional = true, default-features = false, features = ["rt-tokio"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Rotation-independent ids for lifetime counters (`lifetime_counter_id`).
hex = "0.4"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", optional = true, default-features = false, features = ["rt-multi-thread", "sync"] }
zeroize = { version = "1", default-features = false }

[dev-dependencies]
# Tests against DynamoDB Local need an HTTP client; the library leaves that to the app.
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
datadeft-auth-token-core = { path = "../datadeft-auth-token-core", version = "0.5.0", features = ["test-support"] } # x-release-please-version
datadeft-magic-link-core = { path = "../datadeft-magic-link-core", version = "0.5.0" } # x-release-please-version
# SES tests inspect the request the outbox sends, without a network.
aws-smithy-http-client = { version = "1", features = ["test-util"] }
# Model-conformance property tests; OsRng for unique ids against DynamoDB Local.
proptest = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync"] }
