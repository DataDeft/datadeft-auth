[package]
name = "dd-magic-link-aws"
description = "Optional AWS DynamoDB/SES adapters for dd-magic-link-service."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []
aws = [
  "dep:aws-sdk-dynamodb",
  "dep:aws-sdk-secretsmanager",
  "dep:aws-sdk-sesv2",
  "dep:tokio",
]

[dependencies]
dd-magic-link-service = { path = "../dd-magic-link-service" }
aws-sdk-dynamodb = { version = "1", optional = true, default-features = false, features = ["rt-tokio"] }
aws-sdk-secretsmanager = { version = "1", optional = true, default-features = false, features = ["rt-tokio"] }
aws-sdk-sesv2 = { version = "1", optional = true, default-features = false, features = ["rt-tokio"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", optional = true, default-features = false, features = ["rt-multi-thread", "sync"] }
zeroize = { version = "1", default-features = false }

[dev-dependencies]
dd-auth-token-core = { path = "../dd-auth-token-core", features = ["test-support"] }
dd-magic-link-core = { path = "../dd-magic-link-core" }
rand_core = "0.6"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
