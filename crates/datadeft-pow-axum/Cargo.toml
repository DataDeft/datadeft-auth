[package]
name = "datadeft-pow-axum"
description = "Optional Axum HTTP glue for the datadeft-pow-core proof-of-work admission gate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["authentication", "security", "proof-of-work"]
include = ["src/**", "tests/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["json"] }
datadeft-auth-token-core = { path = "../datadeft-auth-token-core", version = "0.2.1" } # x-release-please-version
datadeft-pow-core = { path = "../datadeft-pow-core", version = "0.2.1" } # x-release-please-version
rand_core = "0.6"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
datadeft-auth-token-core = { path = "../datadeft-auth-token-core", version = "0.2.1", features = ["test-support"] } # x-release-please-version
blake3 = "1"
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
serde_json = "1"
