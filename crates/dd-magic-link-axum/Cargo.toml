[package]
name = "dd-magic-link-axum"
description = "Optional Axum HTTP integration for dd-magic-link-service."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["form", "json"] }
dd-magic-link-service = { path = "../dd-magic-link-service" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
dd-auth-token-core = { path = "../dd-auth-token-core", features = ["test-support"] }
dd-magic-link-core = { path = "../dd-magic-link-core" }
rand_core = "0.6"
tokio = { version = "1", features = ["macros", "rt"] }
