[package]
name = "dd-pow-core"
description = "Pure, IO-free proof-of-work challenge mint/verify."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
dd-auth-token-core = { path = "../dd-auth-token-core" }
blake3 = "1"
hex = "0.4"
hmac = "0.12"
rand_core = "0.6"
sha2 = "0.10"
subtle = "2"
time = { version = "0.3.47", default-features = false, features = ["parsing"] }
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
dd-auth-token-core = { path = "../dd-auth-token-core", features = ["test-support"] }
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
