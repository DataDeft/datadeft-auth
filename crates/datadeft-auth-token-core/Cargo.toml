[package]
name = "datadeft-auth-token-core"
description = "Reusable base62 and Branca token primitives."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["authentication", "security", "passwordless"]
include = ["src/**", "tests/**", "README.md", "LICENSE"]

[features]
default = []
test-support = []

[lints]
workspace = true

[dependencies]
# The `zeroize` features (opt-in since the 0.11 generation) wipe key-derived
# cipher and hash state on drop; src/lib.rs fails to compile without them.
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
# Only enables zeroization of the stream cipher's buffered keystream.
cipher = { version = "0.5", default-features = false, features = ["zeroize"] }
hkdf = "0.13"
rand_core = "0.6"
sha2 = { version = "0.11", features = ["zeroize"] }
zeroize = { version = "1", default-features = false }

[dev-dependencies]
hex = "0.4"
# Property tests for the codecs and cookie framing; OsRng for test keys.
proptest = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
