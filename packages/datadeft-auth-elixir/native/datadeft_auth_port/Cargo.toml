[package]
name = "datadeft-auth-port"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Private local process transport for the datadeft_auth Elixir package"

[lints]
workspace = true

[dependencies]
# Workspace crates; the Hex package stage vendors them so the published
# source builds without this checkout.
datadeft-magic-link-aws = { path = "../../../../crates/datadeft-magic-link-aws" }
datadeft-magic-link-service = { path = "../../../../crates/datadeft-magic-link-service" }
# Owner: this crate. Reason: OS-backed CSPRNG for the service entropy inputs.
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# Owner: this crate. Reason: bounded concurrent job execution over the Port
# pipe; required by the AWS SDK clients this process will own.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
# Test-only: encode deterministic secret-document keys.
base64 = "0.22"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
