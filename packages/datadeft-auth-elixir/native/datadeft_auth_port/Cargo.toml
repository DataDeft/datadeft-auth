[package]
name = "datadeft-auth-port"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Private local process transport for the datadeft_auth Elixir package"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# Owner: this crate. Reason: bounded concurrent job execution over the Port
# pipe; required by the AWS SDK clients this process will own.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
